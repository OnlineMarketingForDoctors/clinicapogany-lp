<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Clinica Pogany — Pagini de Prezentare</title>
<link rel="icon" href="/wp-content/uploads/2025/07/cropped-icon-32x32.png" sizes="32x32">
<style>
  :root{--plum:#934bbb;--plum-d:#8a226f;--ink:#2b2530;--muted:#6f6570;--cream:#f6f1ef;--line:#e9dfe8}
  *{box-sizing:border-box}
  body{margin:0;font-family:Roboto,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#faf7fb 0%,#f2e9f3 100%);min-height:100vh}
  .wrap{max-width:920px;margin:0 auto;padding:56px 22px 80px}
  header{text-align:center;margin-bottom:44px}
  header img{height:82px;width:auto;margin:0 auto 22px;display:block}
  h1{font-family:Baskervville,Georgia,serif;font-weight:400;font-size:38px;line-height:1.15;margin:0 0 8px}
  h1 span{color:var(--plum)}
  .sub{color:var(--muted);font-size:15px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:0 26px 0 26px;
    padding:26px 26px 22px;text-decoration:none;color:inherit;box-shadow:0 10px 34px rgba(60,30,70,.08);
    border-bottom:4px solid var(--plum);transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 46px rgba(60,30,70,.16)}
  .eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--plum-d);font-weight:700;margin-bottom:10px}
  .card h2{font-family:Baskervville,Georgia,serif;font-weight:400;font-size:23px;margin:0 0 8px;line-height:1.2}
  .card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px;flex:1}
  .go{align-self:flex-start;color:var(--plum-d);font-weight:700;font-size:13.5px;letter-spacing:.4px}
  .go::after{content:" →"}
  footer{text-align:center;color:#9a90a0;font-size:12.5px;margin-top:52px}
  @media(max-width:520px){h1{font-size:30px}.wrap{padding:40px 18px 64px}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="/wp-content/uploads/2025/08/logo.png" alt="Clinica Pogany">
      <h1>Pagini de <span>Prezentare</span></h1>
      <p class="sub">Clinica Pogany — pagini de campanie</p>
    </header>

    <main class="grid">
      <!-- Landing pages. Add a new .card block per page as they are built. -->
      <a class="card" href="/bariatric-surgery">
        <div class="eyebrow">Chirurgia conturului corporal</div>
        <h2>Chirurgie Postbariatrică</h2>
        <p>Remodelarea conturului corporal după slăbire majoră — abdomen, brațe, coapse și mai mult, la standarde universitare.</p>
        <span class="go">Vezi pagina</span>
      </a>
    </main>

    <footer>&copy;2026 Clinica Pogany · pagini interne</footer>
  </div>
</body>
</html>
